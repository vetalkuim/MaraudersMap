name: Build APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            echo "::warning::Gradle wrapper not found - generating"
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Install stable debug keystore
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Stable debug keystore installed"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set - APK signed with random key"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME//\//-}
          REPO=${GITHUB_REPOSITORY#*/}
          count=0
          while IFS= read -r f; do
            count=$((count+1))
            cp "$f" "dist/${REPO}-$(basename "$f" .apk)-${BRANCH}-${SHORT_SHA}.apk"
          done < <(find . -path '*/build/outputs/apk/*' -name '*.apk' -not -path './dist/*')
          if [ "$count" -eq 0 ]; then echo "::error::APK not found"; exit 1; fi
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14

      - name: Publish "latest" release (main/master only)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.apk \
            --title "Latest build #${{ github.run_number }}" \
            --notes "Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --prerelease --target "$GITHUB_SHA"
